name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the release asset (artifacts are quota-limited).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          # ubuntu-latest ships an Android SDK; accept licenses so Gradle can fetch what it needs
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Push notifications are FCM-direct: the device registers a native FCM
      # token, so the APK must be built with google-services.json for
      # com.nileorbit.newsrator. The file holds project keys and is therefore not
      # in git; CI writes it from the GOOGLE_SERVICES_JSON secret (raw JSON or base64).
      #
      # A missing secret fails the job on purpose: shipping an APK that cannot
      # receive push is worse than no APK, and a silent warning here is exactly
      # how the previous build reached users with push broken.
      - name: Add Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set. Push notifications are FCM-direct, so the APK cannot be built without google-services.json. Add the file contents (package com.nileorbit.newsrator) as a repository secret named GOOGLE_SERVICES_JSON."
            exit 1
          fi
          # The secret may hold the raw JSON or its base64. Detect instead of
          # asking the user to encode; never echo the value either way.
          TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]')
          FIRST=${TRIMMED:0:1}
          if [ "$FIRST" = "{" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
            echo "secret is raw JSON"
          else
            printf '%s' "$TRIMMED" | base64 -d > apps/mobile/google-services.json
            echo "secret is base64"
          fi
          python3 -c "import json,sys; c=json.load(open('apps/mobile/google-services.json')); p=[x.get('client_info',{}).get('android_client_info',{}).get('package_name') for x in c.get('client',[])]; sys.exit('google-services.json has no client for com.nileorbit.newsrator (found: %s)' % p) if 'com.nileorbit.newsrator' not in p else print('google-services.json ok - project %s, package com.nileorbit.newsrator' % c.get('project_info',{}).get('project_id'))"

      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Verify Firebase config reached the Android project
        run: |
          test -f apps/mobile/android/app/google-services.json \
            || { echo "::error::app.config.js did not copy google-services.json into android/app"; exit 1; }
          grep -q "com.google.gms.google-services" apps/mobile/android/app/build.gradle \
            || { echo "::error::the google-services Gradle plugin was not applied"; exit 1; }
          echo "google-services.json in android/app + Gradle plugin applied"

      - name: Build APK (arm64-v8a only)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true

      - name: Check APK size
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))
          echo "APK size: ${MB} MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::error::APK exceeds 30 MB (${MB} MB)"
            exit 1
          fi

      # GitHub Actions artifact storage is quota-limited for this account, and a
      # failed upload fails the job. Releases are not counted against that quota,
      # so publish the APK as a prerelease asset instead.
      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             dist/rais-altahrir-arm64-${{ github.run_number }}.apk
          ls -lh dist/

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: رئيس التحرير build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          files: dist/rais-altahrir-arm64-${{ github.run_number }}.apk
          body: |
            Android APK from commit ${{ github.sha }} (run ${{ github.run_number }}).
            ABI: arm64-v8a only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
