name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/build-android.yml'

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the release asset (artifacts are quota-limited).
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          # ubuntu-latest ships an Android SDK; accept licenses so Gradle can fetch what it needs
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Push notifications need the Firebase Android config: expo-notifications
      # derives the push token from an FCM token, and without google-services.json
      # FirebaseMessaging.getInstance() throws natively at runtime. The file
      # holds project keys, so it comes from a repository secret rather than git.
      # Missing secret: the build still succeeds, it just cannot push.
      - name: Add Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > apps/mobile/google-services.json
            echo "google-services.json written ($(wc -c < apps/mobile/google-services.json) bytes)"
          else
            echo "::warning::GOOGLE_SERVICES_JSON_B64 is not set — this APK cannot receive push notifications."
          fi

      - name: Prebuild Android
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Verify Firebase config reached the Android project
        run: |
          if [ -f apps/mobile/google-services.json ]; then
            test -f apps/mobile/android/app/google-services.json \
              && echo "google-services.json copied into android/app" \
              || { echo "::error::app.config.js did not copy google-services.json"; exit 1; }
          else
            echo "no google-services.json — skipping verification (push disabled in this build)"
          fi

      - name: Build APK (arm64-v8a only)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a -Pexpo.useLegacyPackaging=true

      - name: Check APK size
        run: |
          APK=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          SIZE=$(stat -c%s "$APK")
          MB=$((SIZE / 1024 / 1024))
          echo "APK size: ${MB} MB"
          if [ "$SIZE" -gt 31457280 ]; then
            echo "::error::APK exceeds 30 MB (${MB} MB)"
            exit 1
          fi

      # GitHub Actions artifact storage is quota-limited for this account, and a
      # failed upload fails the job. Releases are not counted against that quota,
      # so publish the APK as a prerelease asset instead.
      - name: Stage APK for release
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             dist/rais-altahrir-arm64-${{ github.run_number }}.apk
          ls -lh dist/

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: رئيس التحرير build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          files: dist/rais-altahrir-arm64-${{ github.run_number }}.apk
          body: |
            Android APK from commit ${{ github.sha }} (run ${{ github.run_number }}).
            ABI: arm64-v8a only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
