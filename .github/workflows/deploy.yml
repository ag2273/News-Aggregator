name: Deploy server to VM

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - 'docker-compose.yml'
      - 'deploy/**'
      # The workflow file itself: without this, a fix to the deploy job never
      # runs the deploy job, so a broken one stays broken until the next unrelated
      # server change.
      - '.github/workflows/deploy.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch: {}

concurrency:
  group: vm-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: news.nileorbit.com
          username: growthconsulting_ai
          key: ${{ secrets.DEPLOY_KEY }}
          # The box is a 1GB e2-micro running 29 feed ingestions and a Docker
          # build at the same time; a rebuild can push its load past 20 and stall
          # the default timeouts. That is how the deploy for 3f9c837 failed with
          # the git pull already applied and the container still on the old image:
          # a timeout is not a failed build, and it left production un-updated
          # with nothing on the screen to say so.
          command_timeout: 30m
          timeout: 120s
          script_stop: true
          script: |
            set -e
            cd ~/news-aggregator
            git pull --ff-only
            # Lower the build's priority: intake must keep answering while the
            # image compiles, or the site 502s for the length of the deploy.
            nice -n 10 docker compose up -d --build
            # Report what actually ended up running, so a silent no-op is visible.
            # The health check reads the container's own HEALTHCHECK rather than
            # curling localhost:3001 — that port is not published to the host, it
            # is only reachable on the compose network, so a host curl would fail
            # on a perfectly healthy deploy.
            docker compose ps --format '{{.Service}} {{.Image}} {{.Status}}'
            test "$(docker inspect --format '{{.State.Health.Status}}' news-aggregator-server-1)" = healthy
