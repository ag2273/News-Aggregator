# Self-hosted deployment for the News Aggregator server.
#
# Usage (from the repository root):
#   cp deploy/.env.example deploy/.env   # then edit DOMAIN
#   docker compose up -d --build
#
# Caddy terminates TLS and proxies to the app on the internal network.
# The app port 3001 is NOT published on the host.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    # CI builds this image on a GitHub runner and pushes it; the VM only pulls.
    # The local tag stays the default so `docker compose up -d --build` still works
    # on a fresh checkout, and a deploy can point it at a built image instead of
    # compiling on the serving box.
    image: ${SERVER_IMAGE:-news-aggregator-server:local}
    environment:
      DATA_DIR: /data
      PORT: "3001"
      NODE_ENV: production
    volumes:
      - server-data:/data
      # Secrets (never in git): the Firebase service-account key and the Resend
      # API key live in ./deploy/secrets on the host and are mounted read-only.
      # Missing files disable push / verification email but never crash.
      - ./deploy/secrets:/data/secrets:ro
    restart: unless-stopped
    # Bounded logs. The host uses Docker's json-file driver, which has NO limit by
    # default, so an unbounded log is one disk-full away from taking the box down.
    # 10MB x 3 files = a hard 30MB ceiling for this container.
    #
    # Measured 2026-11-24: the server writes about 2.3KB per 10 minutes (~0.3MB/day),
    # so the ceiling is reached after roughly three months and then the oldest file is
    # dropped. The privacy page states the cap, not a promise about age.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./deploy/.env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server-data:
  caddy-data:
  caddy-config:
